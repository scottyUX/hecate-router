schema_version: hecate.observation.v1
cadence: 5
command_window: 5
initial_decision: false
error_signature: stderr-whitespace-v1
advisor_max_age_interactions: 5
normalization:
  epsilon: 0.000001
  clipping: none
features:
  - completed_interactions
  - model_requests
  - transport_attempts
  - advisor_calls
  - request_budget_used
  - elapsed_s
  - time_budget_used
  - command_failure_rate
  - command_timeouts
  - repeated_errors
  - visible_passed
  - visible_failed
  - visible_pass_delta
  - input_tokens
  - output_tokens
  - inference_s
  - context_used
  - active_model_m2
  - advisor_progress
  - advisor_stuckness
  - advisor_remaining_difficulty
  - advisor_confidence
