# Option A model configuration (S4 complete).
# All four slugs + prices verified 2026-07-14 against OpenRouter /api/v1/models.
#
# Dry-run cost estimate for full Stage-1 sweep (300 tasks × 4 models = 1,200 samples).
# Assumptions: avg prompt / completion tokens below (not measured yet — update after pilot).
#   Mid  (4k prompt, 1.5k completion): ~$1.01 total
#   High (8k prompt, 4k completion):   ~$2.29 total
# Both well under budget.target_usd ($38) and budget.ceiling_usd ($100).
# Per-model mid totals (300 samples each):
#   qwen-2.5-72b: $0.61 | llama-3.3-70b: $0.26 | qwen-2.5-7b: $0.09 | llama-3.1-8b: $0.04

provider: openrouter
base_url: https://openrouter.ai/api/v1

budget:
  target_usd: 38.0
  ceiling_usd: 100.0

decoding:
  temperature: 0.0
  max_tokens: 4096

context:
  method: oracle  # oracle | bm25

models:
  - slug: qwen/qwen-2.5-72b-instruct  # verified 2026-07-14 via OpenRouter /api/v1/models
    tier: large
    input_cost_per_1m: 0.36
    output_cost_per_1m: 0.40

  - slug: meta-llama/llama-3.3-70b-instruct  # verified OpenRouter 2026-07-14
    tier: large
    input_cost_per_1m: 0.10
    output_cost_per_1m: 0.32

  - slug: qwen/qwen-2.5-7b-instruct  # verified 2026-07-14 via OpenRouter /api/v1/models
    tier: small
    input_cost_per_1m: 0.04
    output_cost_per_1m: 0.10

  - slug: meta-llama/llama-3.1-8b-instruct  # verified OpenRouter 2026-07-14
