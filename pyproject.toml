[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecate"
version = "0.1.0"
description = "Execution-grounded LLM routing for coding tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "swebench==4.1.0",
    "datasets>=2.19,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "unidiff>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
