[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecate"
version = "0.1.0"
description = "Execution-grounded LLM routing for coding tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "swebench==4.1.0",
    "datasets>=2.19,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "unidiff>=0.7,<1",
    "GitPython>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<1",
]
train = [
    "torch>=2.2,<3",
    "transformers>=4.44,<5",
]

[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: opt-in test that makes a real OpenRouter call (requires RUN_LIVE_TESTS=1 and OPENROUTER_API_KEY)",
    "live_eval: opt-in Docker SWE-bench evaluation (requires RUN_LIVE_EVAL=1)",
    "slow_router: opt-in test that loads ModernBERT (~150M) and a real head checkpoint (requires RUN_ROUTER_INTEG=1)",
]
